services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      # 大規模リポジトリ解析時のメモリ枯渇でホストごと落とさないためのソフト上限。
      # 近傍パッケージ数の上限(defaultMaxNeighborhood)が主たる対策で、これは保険。
      GOMEMLIMIT: "4GiB"
    # OOM 時にホスト(WSL)を巻き込まずコンテナ単体で完結させるためのハード上限。
    mem_limit: 5g
    volumes:
      - ./data:/app/data
    develop:
      watch:
        - action: rebuild
          path: ./backend
          ignore:
            - tmp/

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    expose:
      - "5173"
    env_file:
      - .env
    volumes:
      - ./frontend:/app
    develop:
      watch:
        - action: rebuild
          path: ./frontend/package.json
