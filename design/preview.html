<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>diffmap. — PR依存関係可視化ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #faf8f3; font-family: "Inter Tight", -apple-system, system-ui, sans-serif; }
  * { box-sizing: border-box; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">

// DesignCanvas.jsx — Figma-ish design canvas wrapper
// Warm gray grid bg + Sections + Artboards + PostIt notes.
// Artboards are reorderable (grip-drag), labels/titles are inline-editable,
// and any artboard can be opened in a fullscreen focus overlay (←/→/Esc).
// State persists to a .design-canvas.state.json sidecar via the host
// bridge. No assets, no deps.
//
// Usage:
//   <DesignCanvas>
//     <DCSection id="onboarding" title="Onboarding" subtitle="First-run variants">
//       <DCArtboard id="a" label="A · Dusk" width={260} height={480}>…</DCArtboard>
//       <DCArtboard id="b" label="B · Minimal" width={260} height={480}>…</DCArtboard>
//     </DCSection>
//   </DesignCanvas>

const DC = {
  bg: '#f0eee9',
  grid: 'rgba(0,0,0,0.06)',
  label: 'rgba(60,50,40,0.7)',
  title: 'rgba(40,30,20,0.85)',
  subtitle: 'rgba(60,50,40,0.6)',
  postitBg: '#fef4a8',
  postitText: '#5a4a2a',
  font: '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif',
};

// One-time CSS injection (classes are dc-prefixed so they don't collide with
// the hosted design's own styles).
if (typeof document !== 'undefined' && !document.getElementById('dc-styles')) {
  const s = document.createElement('style');
  s.id = 'dc-styles';
  s.textContent = [
    '.dc-editable{cursor:text;outline:none;white-space:nowrap;border-radius:3px;padding:0 2px;margin:0 -2px}',
    '.dc-editable:focus{background:#fff;box-shadow:0 0 0 1.5px #c96442}',
    '[data-dc-slot]{transition:transform .18s cubic-bezier(.2,.7,.3,1)}',
    '[data-dc-slot].dc-dragging{transition:none;z-index:10;pointer-events:none}',
    '[data-dc-slot].dc-dragging .dc-card{box-shadow:0 12px 40px rgba(0,0,0,.25),0 0 0 2px #c96442;transform:scale(1.02)}',
    '.dc-card{transition:box-shadow .15s,transform .15s}',
    '.dc-card *{scrollbar-width:none}',
    '.dc-card *::-webkit-scrollbar{display:none}',
    '.dc-labelrow{display:flex;align-items:center;gap:4px;height:24px}',
    '.dc-grip{cursor:grab;display:flex;align-items:center;padding:5px 4px;border-radius:4px;transition:background .12s}',
    '.dc-grip:hover{background:rgba(0,0,0,.08)}',
    '.dc-grip:active{cursor:grabbing}',
    '.dc-labeltext{cursor:pointer;border-radius:4px;padding:3px 6px;display:flex;align-items:center;transition:background .12s}',
    '.dc-labeltext:hover{background:rgba(0,0,0,.05)}',
    '.dc-expand{position:absolute;bottom:100%;right:0;margin-bottom:5px;z-index:2;opacity:0;transition:opacity .12s,background .12s;',
    '  width:22px;height:22px;border-radius:5px;border:none;cursor:pointer;padding:0;',
    '  background:transparent;color:rgba(60,50,40,.7);display:flex;align-items:center;justify-content:center}',
    '.dc-expand:hover{background:rgba(0,0,0,.06);color:#2a251f}',
    '[data-dc-slot]:hover .dc-expand{opacity:1}',
  ].join('\n');
  document.head.appendChild(s);
}

const DCCtx = React.createContext(null);

// ─────────────────────────────────────────────────────────────
// DesignCanvas — stateful wrapper around the pan/zoom viewport.
// Owns runtime state (per-section order, renamed titles/labels, focused
// artboard). Order/titles/labels persist to a .design-canvas.state.json
// sidecar next to the HTML. Reads go via plain fetch() so the saved
// arrangement is visible anywhere the HTML + sidecar are served together
// (omelette preview, direct link, downloaded zip). Writes go through the
// host's window.omelette bridge — editing requires the omelette runtime.
// Focus is ephemeral.
// ─────────────────────────────────────────────────────────────
const DC_STATE_FILE = '.design-canvas.state.json';

function DesignCanvas({ children, minScale, maxScale, style }) {
  const [state, setState] = React.useState({ sections: {}, focus: null });
  // Hold rendering until the sidecar read settles so the saved order/titles
  // appear on first paint (no source-order flash). didRead gates writes until
  // the read settles so the empty initial state can't clobber a slow read;
  // skipNextWrite suppresses the one echo-write that would otherwise follow
  // hydration.
  const [ready, setReady] = React.useState(false);
  const didRead = React.useRef(false);
  const skipNextWrite = React.useRef(false);

  React.useEffect(() => {
    let off = false;
    fetch('./' + DC_STATE_FILE)
      .then((r) => (r.ok ? r.json() : null))
      .then((saved) => {
        if (off || !saved || !saved.sections) return;
        skipNextWrite.current = true;
        setState((s) => ({ ...s, sections: saved.sections }));
      })
      .catch(() => {})
      .finally(() => { didRead.current = true; if (!off) setReady(true); });
    const t = setTimeout(() => { if (!off) setReady(true); }, 150);
    return () => { off = true; clearTimeout(t); };
  }, []);

  React.useEffect(() => {
    if (!didRead.current) return;
    if (skipNextWrite.current) { skipNextWrite.current = false; return; }
    const t = setTimeout(() => {
      window.omelette?.writeFile(DC_STATE_FILE, JSON.stringify({ sections: state.sections })).catch(() => {});
    }, 250);
    return () => clearTimeout(t);
  }, [state.sections]);

  // Build registries synchronously from children so FocusOverlay can read
  // them in the same render. Only direct DCSection > DCArtboard children are
  // walked — wrapping them in other elements opts out of focus/reorder.
  const registry = {};     // slotId -> { sectionId, artboard }
  const sectionMeta = {};  // sectionId -> { title, subtitle, slotIds[] }
  const sectionOrder = [];
  React.Children.forEach(children, (sec) => {
    if (!sec || sec.type !== DCSection) return;
    const sid = sec.props.id ?? sec.props.title;
    if (!sid) return;
    sectionOrder.push(sid);
    const persisted = state.sections[sid] || {};
    const srcIds = [];
    React.Children.forEach(sec.props.children, (ab) => {
      if (!ab || ab.type !== DCArtboard) return;
      const aid = ab.props.id ?? ab.props.label;
      if (!aid) return;
      registry[`${sid}/${aid}`] = { sectionId: sid, artboard: ab };
      srcIds.push(aid);
    });
    const kept = (persisted.order || []).filter((k) => srcIds.includes(k));
    sectionMeta[sid] = {
      title: persisted.title ?? sec.props.title,
      subtitle: sec.props.subtitle,
      slotIds: [...kept, ...srcIds.filter((k) => !kept.includes(k))],
    };
  });

  const api = React.useMemo(() => ({
    state,
    section: (id) => state.sections[id] || {},
    patchSection: (id, p) => setState((s) => ({
      ...s,
      sections: { ...s.sections, [id]: { ...s.sections[id], ...(typeof p === 'function' ? p(s.sections[id] || {}) : p) } },
    })),
    setFocus: (slotId) => setState((s) => ({ ...s, focus: slotId })),
  }), [state]);

  // Esc exits focus; any outside pointerdown commits an in-progress rename.
  React.useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') api.setFocus(null); };
    const onPd = (e) => {
      const ae = document.activeElement;
      if (ae && ae.isContentEditable && !ae.contains(e.target)) ae.blur();
    };
    document.addEventListener('keydown', onKey);
    document.addEventListener('pointerdown', onPd, true);
    return () => {
      document.removeEventListener('keydown', onKey);
      document.removeEventListener('pointerdown', onPd, true);
    };
  }, [api]);

  return (
    <DCCtx.Provider value={api}>
      <DCViewport minScale={minScale} maxScale={maxScale} style={style}>{ready && children}</DCViewport>
      {state.focus && registry[state.focus] && (
        <DCFocusOverlay entry={registry[state.focus]} sectionMeta={sectionMeta} sectionOrder={sectionOrder} />
      )}
    </DCCtx.Provider>
  );
}

// ─────────────────────────────────────────────────────────────
// DCViewport — transform-based pan/zoom (internal)
//
// Input mapping (Figma-style):
//   • trackpad pinch  → zoom   (ctrlKey wheel; Safari gesture* events)
//   • trackpad scroll → pan    (two-finger)
//   • mouse wheel     → zoom   (notched; distinguished from trackpad scroll)
//   • middle-drag / primary-drag-on-bg → pan
//
// Transform state lives in a ref and is written straight to the DOM
// (translate3d + will-change) so wheel ticks don't go through React —
// keeps pans at 60fps on dense canvases.
// ─────────────────────────────────────────────────────────────
function DCViewport({ children, minScale = 0.1, maxScale = 8, style = {} }) {
  const vpRef = React.useRef(null);
  const worldRef = React.useRef(null);
  const tf = React.useRef({ x: 0, y: 0, scale: 1 });

  const apply = React.useCallback(() => {
    const { x, y, scale } = tf.current;
    const el = worldRef.current;
    if (el) el.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${scale})`;
  }, []);

  React.useEffect(() => {
    const vp = vpRef.current;
    if (!vp) return;

    const zoomAt = (cx, cy, factor) => {
      const r = vp.getBoundingClientRect();
      const px = cx - r.left, py = cy - r.top;
      const t = tf.current;
      const next = Math.min(maxScale, Math.max(minScale, t.scale * factor));
      const k = next / t.scale;
      // keep the world point under the cursor fixed
      t.x = px - (px - t.x) * k;
      t.y = py - (py - t.y) * k;
      t.scale = next;
      apply();
    };

    // Mouse-wheel vs trackpad-scroll heuristic. A physical wheel sends
    // line-mode deltas (Firefox) or large integer pixel deltas with no X
    // component (Chrome/Safari, typically multiples of 100/120). Trackpad
    // two-finger scroll sends small/fractional pixel deltas, often with
    // non-zero deltaX. ctrlKey is set by the browser for trackpad pinch.
    const isMouseWheel = (e) =>
      e.deltaMode !== 0 ||
      (e.deltaX === 0 && Number.isInteger(e.deltaY) && Math.abs(e.deltaY) >= 40);

    const onWheel = (e) => {
      e.preventDefault();
      if (isGesturing) return; // Safari: gesture* owns the pinch — discard concurrent wheels
      if (e.ctrlKey) {
        // trackpad pinch (or explicit ctrl+wheel)
        zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.01));
      } else if (isMouseWheel(e)) {
        // notched mouse wheel — fixed-ratio step per click
        zoomAt(e.clientX, e.clientY, Math.exp(-Math.sign(e.deltaY) * 0.18));
      } else {
        // trackpad two-finger scroll — pan
        tf.current.x -= e.deltaX;
        tf.current.y -= e.deltaY;
        apply();
      }
    };

    // Safari sends native gesture* events for trackpad pinch with a smooth
    // e.scale; preferring these over the ctrl+wheel fallback gives a much
    // better feel there. No-ops on other browsers. Safari also fires
    // ctrlKey wheel events during the same pinch — isGesturing makes
    // onWheel drop those entirely so they neither zoom nor pan.
    let gsBase = 1;
    let isGesturing = false;
    const onGestureStart = (e) => { e.preventDefault(); isGesturing = true; gsBase = tf.current.scale; };
    const onGestureChange = (e) => {
      e.preventDefault();
      zoomAt(e.clientX, e.clientY, (gsBase * e.scale) / tf.current.scale);
    };
    const onGestureEnd = (e) => { e.preventDefault(); isGesturing = false; };

    // Drag-pan: middle button anywhere, or primary button on canvas
    // background (anything that isn't an artboard or an inline editor).
    let drag = null;
    const onPointerDown = (e) => {
      const onBg = !e.target.closest('[data-dc-slot], .dc-editable');
      if (!(e.button === 1 || (e.button === 0 && onBg))) return;
      e.preventDefault();
      vp.setPointerCapture(e.pointerId);
      drag = { id: e.pointerId, lx: e.clientX, ly: e.clientY };
      vp.style.cursor = 'grabbing';
    };
    const onPointerMove = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      tf.current.x += e.clientX - drag.lx;
      tf.current.y += e.clientY - drag.ly;
      drag.lx = e.clientX; drag.ly = e.clientY;
      apply();
    };
    const onPointerUp = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      vp.releasePointerCapture(e.pointerId);
      drag = null;
      vp.style.cursor = '';
    };

    vp.addEventListener('wheel', onWheel, { passive: false });
    vp.addEventListener('gesturestart', onGestureStart, { passive: false });
    vp.addEventListener('gesturechange', onGestureChange, { passive: false });
    vp.addEventListener('gestureend', onGestureEnd, { passive: false });
    vp.addEventListener('pointerdown', onPointerDown);
    vp.addEventListener('pointermove', onPointerMove);
    vp.addEventListener('pointerup', onPointerUp);
    vp.addEventListener('pointercancel', onPointerUp);
    return () => {
      vp.removeEventListener('wheel', onWheel);
      vp.removeEventListener('gesturestart', onGestureStart);
      vp.removeEventListener('gesturechange', onGestureChange);
      vp.removeEventListener('gestureend', onGestureEnd);
      vp.removeEventListener('pointerdown', onPointerDown);
      vp.removeEventListener('pointermove', onPointerMove);
      vp.removeEventListener('pointerup', onPointerUp);
      vp.removeEventListener('pointercancel', onPointerUp);
    };
  }, [apply, minScale, maxScale]);

  const gridSvg = `url("data:image/svg+xml,%3Csvg width='120' height='120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M120 0H0v120' fill='none' stroke='${encodeURIComponent(DC.grid)}' stroke-width='1'/%3E%3C/svg%3E")`;
  return (
    <div
      ref={vpRef}
      className="design-canvas"
      style={{
        height: '100vh', width: '100vw',
        background: DC.bg,
        overflow: 'hidden',
        overscrollBehavior: 'none',
        touchAction: 'none',
        position: 'relative',
        fontFamily: DC.font,
        boxSizing: 'border-box',
        ...style,
      }}
    >
      <div
        ref={worldRef}
        style={{
          position: 'absolute', top: 0, left: 0,
          transformOrigin: '0 0',
          willChange: 'transform',
          width: 'max-content', minWidth: '100%',
          minHeight: '100%',
          padding: '60px 0 80px',
        }}
      >
        <div style={{ position: 'absolute', inset: -6000, backgroundImage: gridSvg, backgroundSize: '120px 120px', pointerEvents: 'none', zIndex: -1 }} />
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// DCSection — editable title + h-row of artboards in persisted order
// ─────────────────────────────────────────────────────────────
function DCSection({ id, title, subtitle, children, gap = 48 }) {
  const ctx = React.useContext(DCCtx);
  const sid = id ?? title;
  const all = React.Children.toArray(children);
  const artboards = all.filter((c) => c && c.type === DCArtboard);
  const rest = all.filter((c) => !(c && c.type === DCArtboard));
  const srcOrder = artboards.map((a) => a.props.id ?? a.props.label);
  const sec = (ctx && sid && ctx.section(sid)) || {};

  const order = React.useMemo(() => {
    const kept = (sec.order || []).filter((k) => srcOrder.includes(k));
    return [...kept, ...srcOrder.filter((k) => !kept.includes(k))];
  }, [sec.order, srcOrder.join('|')]);

  const byId = Object.fromEntries(artboards.map((a) => [a.props.id ?? a.props.label, a]));

  return (
    <div data-dc-section={sid} style={{ marginBottom: 80, position: 'relative' }}>
      <div style={{ padding: '0 60px 56px' }}>
        <DCEditable tag="div" value={sec.title ?? title}
          onChange={(v) => ctx && sid && ctx.patchSection(sid, { title: v })}
          style={{ fontSize: 28, fontWeight: 600, color: DC.title, letterSpacing: -0.4, marginBottom: 6, display: 'inline-block' }} />
        {subtitle && <div style={{ fontSize: 16, color: DC.subtitle }}>{subtitle}</div>}
      </div>
      <div style={{ display: 'flex', gap, padding: '0 60px', alignItems: 'flex-start', width: 'max-content' }}>
        {order.map((k) => (
          <DCArtboardFrame key={k} sectionId={sid} artboard={byId[k]} order={order}
            label={(sec.labels || {})[k] ?? byId[k].props.label}
            onRename={(v) => ctx && ctx.patchSection(sid, (x) => ({ labels: { ...x.labels, [k]: v } }))}
            onReorder={(next) => ctx && ctx.patchSection(sid, { order: next })}
            onFocus={() => ctx && ctx.setFocus(`${sid}/${k}`)} />
        ))}
      </div>
      {rest}
    </div>
  );
}

// DCArtboard — marker; rendered by DCArtboardFrame via DCSection.
function DCArtboard() { return null; }

function DCArtboardFrame({ sectionId, artboard, label, order, onRename, onReorder, onFocus }) {
  const { id: rawId, label: rawLabel, width = 260, height = 480, children, style = {} } = artboard.props;
  const id = rawId ?? rawLabel;
  const ref = React.useRef(null);

  // Live drag-reorder: dragged card sticks to cursor; siblings slide into
  // their would-be slots in real time via transforms. DOM order only
  // changes on drop.
  const onGripDown = (e) => {
    e.preventDefault(); e.stopPropagation();
    const me = ref.current;
    // translateX is applied in local (pre-scale) space but pointer deltas and
    // getBoundingClientRect().left are screen-space — divide by the viewport's
    // current scale so the dragged card tracks the cursor at any zoom level.
    const scale = me.getBoundingClientRect().width / me.offsetWidth || 1;
    const peers = Array.from(document.querySelectorAll(`[data-dc-section="${sectionId}"] [data-dc-slot]`));
    const homes = peers.map((el) => ({ el, id: el.dataset.dcSlot, x: el.getBoundingClientRect().left }));
    const slotXs = homes.map((h) => h.x);
    const startIdx = order.indexOf(id);
    const startX = e.clientX;
    let liveOrder = order.slice();
    me.classList.add('dc-dragging');

    const layout = () => {
      for (const h of homes) {
        if (h.id === id) continue;
        const slot = liveOrder.indexOf(h.id);
        h.el.style.transform = `translateX(${(slotXs[slot] - h.x) / scale}px)`;
      }
    };

    const move = (ev) => {
      const dx = ev.clientX - startX;
      me.style.transform = `translateX(${dx / scale}px)`;
      const cur = homes[startIdx].x + dx;
      let nearest = 0, best = Infinity;
      for (let i = 0; i < slotXs.length; i++) {
        const d = Math.abs(slotXs[i] - cur);
        if (d < best) { best = d; nearest = i; }
      }
      if (liveOrder.indexOf(id) !== nearest) {
        liveOrder = order.filter((k) => k !== id);
        liveOrder.splice(nearest, 0, id);
        layout();
      }
    };

    const up = () => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      const finalSlot = liveOrder.indexOf(id);
      me.classList.remove('dc-dragging');
      me.style.transform = `translateX(${(slotXs[finalSlot] - homes[startIdx].x) / scale}px)`;
      // After the settle transition, kill transitions + clear transforms +
      // commit the reorder in the same frame so there's no visual snap-back.
      setTimeout(() => {
        for (const h of homes) { h.el.style.transition = 'none'; h.el.style.transform = ''; }
        if (liveOrder.join('|') !== order.join('|')) onReorder(liveOrder);
        requestAnimationFrame(() => requestAnimationFrame(() => {
          for (const h of homes) h.el.style.transition = '';
        }));
      }, 180);
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  };

  return (
    <div ref={ref} data-dc-slot={id} style={{ position: 'relative', flexShrink: 0 }}>
      <div className="dc-labelrow" style={{ position: 'absolute', bottom: '100%', left: -4, marginBottom: 4, color: DC.label }}>
        <div className="dc-grip" onPointerDown={onGripDown} title="Drag to reorder">
          <svg width="9" height="13" viewBox="0 0 9 13" fill="currentColor"><circle cx="2" cy="2" r="1.1"/><circle cx="7" cy="2" r="1.1"/><circle cx="2" cy="6.5" r="1.1"/><circle cx="7" cy="6.5" r="1.1"/><circle cx="2" cy="11" r="1.1"/><circle cx="7" cy="11" r="1.1"/></svg>
        </div>
        <div className="dc-labeltext" onClick={onFocus} title="Click to focus">
          <DCEditable value={label} onChange={onRename} onClick={(e) => e.stopPropagation()}
            style={{ fontSize: 15, fontWeight: 500, color: DC.label, lineHeight: 1 }} />
        </div>
      </div>
      <button className="dc-expand" onClick={onFocus} onPointerDown={(e) => e.stopPropagation()} title="Focus">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M7 1h4v4M5 11H1V7M11 1L7.5 4.5M1 11l3.5-3.5"/></svg>
      </button>
      <div className="dc-card"
        style={{ borderRadius: 2, boxShadow: '0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06)', overflow: 'hidden', width, height, background: '#fff', ...style }}>
        {children || <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#bbb', fontSize: 13, fontFamily: DC.font }}>{id}</div>}
      </div>
    </div>
  );
}

// Inline rename — commits on blur or Enter.
function DCEditable({ value, onChange, style, tag = 'span', onClick }) {
  const T = tag;
  return (
    <T className="dc-editable" contentEditable suppressContentEditableWarning
      onClick={onClick}
      onPointerDown={(e) => e.stopPropagation()}
      onBlur={(e) => onChange && onChange(e.currentTarget.textContent)}
      onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); e.currentTarget.blur(); } }}
      style={style}>{value}</T>
  );
}

// ─────────────────────────────────────────────────────────────
// Focus mode — overlay one artboard; ←/→ within section, ↑/↓ across
// sections, Esc or backdrop click to exit.
// ─────────────────────────────────────────────────────────────
function DCFocusOverlay({ entry, sectionMeta, sectionOrder }) {
  const ctx = React.useContext(DCCtx);
  const { sectionId, artboard } = entry;
  const sec = ctx.section(sectionId);
  const meta = sectionMeta[sectionId];
  const peers = meta.slotIds;
  const aid = artboard.props.id ?? artboard.props.label;
  const idx = peers.indexOf(aid);
  const secIdx = sectionOrder.indexOf(sectionId);

  const go = (d) => { const n = peers[(idx + d + peers.length) % peers.length]; if (n) ctx.setFocus(`${sectionId}/${n}`); };
  const goSection = (d) => {
    const ns = sectionOrder[(secIdx + d + sectionOrder.length) % sectionOrder.length];
    const first = sectionMeta[ns] && sectionMeta[ns].slotIds[0];
    if (first) ctx.setFocus(`${ns}/${first}`);
  };

  React.useEffect(() => {
    const k = (e) => {
      if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
      if (e.key === 'ArrowUp') { e.preventDefault(); goSection(-1); }
      if (e.key === 'ArrowDown') { e.preventDefault(); goSection(1); }

    return () => document.removeEventListener('keydown', k);
  });

  const [vp, setVp] = React.useState({ w: window.innerWidth, h: window.innerHeight });
  React.useEffect(() => { const r = () => setVp({ w: window.innerWidth, h: window.innerHeight }); window.addEventListener('resize', r); return () => window.removeEventListener('resize', r); }, []);
  const scale = Math.max(0.1, Math.min((vp.w - 200) / width, (vp.h - 260) / height, 2));

  const [ddOpen, setDd] = React.useState(false);
  const Arrow = ({ dir, onClick }) => (
    <button onClick={(e) => { e.stopPropagation(); onClick(); }}
      style={{ position: 'absolute', top: '50%', [dir]: 28, transform: 'translateY(-50%)',
        border: 'none', background: 'rgba(255,255,255,.08)', color: 'rgba(255,255,255,.9)',

      onMouseEnter={(e) => (e.currentTarget.style.background = 'rgba(255,255,255,.18)')}
      onMouseLeave={(e) => (e.currentTarget.style.background = 'rgba(255,255,255,.08)')}>

  );

  // transform on DesignCanvas's ancestors (including the canvas zoom itself).
  return ReactDOM.createPortal(
    <div onClick={() => ctx.setFocus(null)}

            </span>
            {meta.subtitle && <span style={{ display: 'block', fontSize: 13, opacity: .6, fontWeight: 400, marginTop: 2 }}>{meta.subtitle}</span>}
          </button>
          {ddOpen && (
            <div style={{ position: 'absolute', top: '100%', left: 0, marginTop: 4, background: '#2a251f', borderRadius: 8,
              boxShadow: '0 8px 32px rgba(0,0,0,.4)', padding: 4, minWidth: 200, zIndex: 10 }}>
              {sectionOrder.map((sid) => (
                <button key={sid} onClick={() => { setDd(false); const f = sectionMeta[sid].slotIds[0]; if (f) ctx.setFocus(`${sid}/${f}`); }}
                  style={{ display: 'block', width: '100%', textAlign: 'left', border: 'none', cursor: 'pointer',
                    background: sid === sectionId ? 'rgba(255,255,255,.1)' : 'transparent', color: '#fff',
                    padding: '8px 12px', borderRadius: 5, fontSize: 14, fontWeight: sid === sectionId ? 600 : 400, fontFamily: 'inherit' }}>
                  {sectionMeta[sid].title}

        <div style={{ flex: 1 }} />
        <button onClick={() => ctx.setFocus(null)}

            borderRadius: 16, fontSize: 20, cursor: 'pointer', lineHeight: 1, transition: 'background .12s' }}>×</button>
      </div>

      {/* card centered, label + index below — only the card itself stops
          propagation so any backdrop click (including the margins around
          the card) exits focus */}
      <div
        style={{ position: 'absolute', top: 64, bottom: 56, left: 100, right: 100, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 16 }}>
        <div onClick={(e) => e.stopPropagation()} style={{ width: width * scale, height: height * scale, position: 'relative' }}>
          <div style={{ width, height, transform: `scale(${scale})`, transformOrigin: 'top left', background: '#fff', borderRadius: 2, overflow: 'hidden',
            boxShadow: '0 20px 80px rgba(0,0,0,.4)' }}>
            {children || <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#bbb' }}>{aid}</div>}
          </div>
        </div>
        <div onClick={(e) => e.stopPropagation()} style={{ fontSize: 14, fontWeight: 500, opacity: .85, textAlign: 'center' }}>
          {(sec.labels || {})[aid] ?? artboard.props.label}
          <span style={{ opacity: .5, marginLeft: 10, fontVariantNumeric: 'tabular-nums' }}>{idx + 1} / {peers.length}</span>
        </div>
      </div>

      <Arrow dir="left" onClick={() => go(-1)} />
      <Arrow dir="right" onClick={() => go(1)} />

      {/* dots */}
      <div onClick={(e) => e.stopPropagation()}
        style={{ position: 'absolute', bottom: 20, left: '50%', transform: 'translateX(-50%)', display: 'flex', gap: 8 }}>
        {peers.map((p, i) => (
          <button key={p} onClick={() => ctx.setFocus(`${sectionId}/${p}`)}
            style={{ border: 'none', padding: 0, cursor: 'pointer', width: 6, height: 6, borderRadius: 3,
              background: i === idx ? '#fff' : 'rgba(255,255,255,.3)' }} />
        ))}
      </div>
    </div>,
    document.body,
  );
}

// ─────────────────────────────────────────────────────────────

function DCPostIt({ children, top, left, right, bottom, rotate = -2, width = 180 }) {

}

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

<script type="text/babel">
// graph-layout.jsx — DAG レイアウトヘルパ
// 入力: モジュール配列 + エッジ配列
// 出力: ノード位置 + エッジパス
// 階層型: レイヤごとに段を分ける + cluster でも同じレイヤ内でグルーピング

function computeDagLayout(modules, edges, opts = {}) {
  const {
    nodeWidth = 140,
    nodeHeight = 56,
    layerGapY = 140,
    nodeGapX = 24,
    layerOrder = ["ui", "domain", "data", "infra"],
    paddingX = 60,
    paddingY = 60,
    groupByCluster = false,
  } = opts;

  // レイヤごとにグループ化
  const byLayer = {};
  for (const ly of layerOrder) byLayer[ly] = [];
  for (const m of modules) {
    if (byLayer[m.layer]) byLayer[m.layer].push(m);
  }

  // 各レイヤ内でクラスタ順にソート
  const clusterOrder = ["added", "modified", "refactor", "removed"];
  for (const ly of layerOrder) {
    byLayer[ly].sort((a, b) => {
      if (groupByCluster) {
        const ca = clusterOrder.indexOf(a.cluster);
        const cb = clusterOrder.indexOf(b.cluster);
        if (ca !== cb) return ca - cb;
      }
      return a.name.localeCompare(b.name);
    });
  }

  // 配置
  const positions = {};
  let maxRowWidth = 0;
  for (let li = 0; li < layerOrder.length; li++) {
    const ly = layerOrder[li];
    const items = byLayer[ly];
    const rowWidth = items.length * nodeWidth + (items.length - 1) * nodeGapX;
    maxRowWidth = Math.max(maxRowWidth, rowWidth);
  }

  for (let li = 0; li < layerOrder.length; li++) {
    const ly = layerOrder[li];
    const items = byLayer[ly];
    const rowWidth = items.length * nodeWidth + (items.length - 1) * nodeGapX;
    const startX = paddingX + (maxRowWidth - rowWidth) / 2;
    const y = paddingY + li * layerGapY;
    items.forEach((m, idx) => {
      positions[m.id] = {
        x: startX + idx * (nodeWidth + nodeGapX),
        y,
        w: nodeWidth,
        h: nodeHeight,
        layer: ly,
        layerIndex: li,
      };
    });
  }

  // エッジパス（ベジェ曲線）
  const edgePaths = edges
    .map(([from, to]) => {
      const a = positions[from];
      const b = positions[to];
      if (!a || !b) return null;
      const x1 = a.x + a.w / 2;
      const y1 = a.y + a.h;
      const x2 = b.x + b.w / 2;
      const y2 = b.y;
      const dy = Math.abs(y2 - y1);
      const cy = dy * 0.45;
      // 同レイヤや上→上のエッジは横にカーブ
      if (b.layerIndex <= a.layerIndex) {
        const offset = 32;
        return {
          from, to,
          d: `M ${x1} ${y1 - a.h/2 + 2} C ${x1 + offset} ${y1 - a.h/2}, ${x2 + offset} ${y2 + b.h/2}, ${x2} ${y2 + b.h/2 - 2}`,
          x1, y1: y1 - a.h/2, x2, y2: y2 + b.h/2,
          backward: true,
        };
      }
      return {
        from, to,
        d: `M ${x1} ${y1} C ${x1} ${y1 + cy}, ${x2} ${y2 - cy}, ${x2} ${y2}`,
        x1, y1, x2, y2,
        backward: false,
      };
    })
    .filter(Boolean);

  const totalWidth = paddingX * 2 + maxRowWidth;
  const totalHeight = paddingY * 2 + (layerOrder.length - 1) * layerGapY + nodeHeight;

  return { positions, edgePaths, totalWidth, totalHeight, byLayer };
}

// スイムレーン版 — 横方向にクラスタ別レーン、縦方向にレイヤ
function computeSwimlaneLayout(modules, edges, opts = {}) {
  const {
    nodeWidth = 130,
    nodeHeight = 50,
    layerGapY = 110,
    nodeGapY = 12,
    laneGapX = 32,
    paddingX = 40,
    paddingY = 60,
    headerH = 48,
    laneOrder = ["added", "modified", "refactor", "removed"],
    layerOrder = ["ui", "domain", "data", "infra"],
  } = opts;

  // 各レーン×レイヤのセルにモジュールを格納
  const cells = {};
  for (const ly of layerOrder) {
    for (const cl of laneOrder) cells[`${ly}/${cl}`] = [];
  }
  for (const m of modules) {
    const k = `${m.layer}/${m.cluster}`;
    if (cells[k]) cells[k].push(m);
  }
  for (const k of Object.keys(cells)) {
    cells[k].sort((a, b) => a.name.localeCompare(b.name));
  }

  // 各レーンの幅 = max(各セルのノード数) * (nodeWidth)
  // ただしここでは各レーン1列に並べる: 幅 = nodeWidth
  const laneWidth = nodeWidth + 28;
  const positions = {};

  laneOrder.forEach((cl, ci) => {
    const laneX = paddingX + ci * (laneWidth + laneGapX) + 14;
    layerOrder.forEach((ly, li) => {
      const list = cells[`${ly}/${cl}`];
      const layerY = paddingY + headerH + li * layerGapY;
      list.forEach((m, ni) => {
        positions[m.id] = {
          x: laneX,
          y: layerY + ni * (nodeHeight + nodeGapY),
          w: nodeWidth,
          h: nodeHeight,
          lane: cl, layer: ly,
        };
      });
    });
  });

  // 各レーンの実際の高さを計算
  const laneCols = laneOrder.map((cl, ci) => paddingX + ci * (laneWidth + laneGapX));
  const totalWidth = paddingX * 2 + laneOrder.length * laneWidth + (laneOrder.length - 1) * laneGapX;

  // レイヤ行の高さを計算
  const layerHeights = layerOrder.map((ly) => {
    let max = 1;
    for (const cl of laneOrder) {
      max = Math.max(max, cells[`${ly}/${cl}`].length);
    }
    return max * (nodeHeight + nodeGapY) + 32;
  });
  // y位置を再計算
  const layerYStarts = [];
  let yc = paddingY + headerH;
  for (let i = 0; i < layerOrder.length; i++) {
    layerYStarts.push(yc);
    yc += layerHeights[i];
  }
  laneOrder.forEach((cl, ci) => {
    const laneX = paddingX + ci * (laneWidth + laneGapX) + 14;
    layerOrder.forEach((ly, li) => {
      const list = cells[`${ly}/${cl}`];
      const layerY = layerYStarts[li] + 12;
      list.forEach((m, ni) => {
        positions[m.id] = {
          x: laneX,
          y: layerY + ni * (nodeHeight + nodeGapY),
          w: nodeWidth,
          h: nodeHeight,
          lane: cl, layer: ly,
        };
      });
    });
  });
  const totalHeight = yc + paddingY;

  // エッジ
  const edgePaths = edges
    .map(([from, to]) => {
      const a = positions[from];
      const b = positions[to];
      if (!a || !b) return null;
      const sameLane = a.lane === b.lane;
      // 同レーン内: 縦の真ん中
      if (sameLane) {
        const x1 = a.x + a.w / 2;
        const y1 = a.y + a.h;
        const x2 = b.x + b.w / 2;
        const y2 = b.y;
        return { from, to, d: `M ${x1} ${y1} L ${x1} ${(y1+y2)/2} L ${x2} ${(y1+y2)/2} L ${x2} ${y2}`, sameLane: true };
      }
      // 他レーン: ノードのサイドを使う
      const x1 = a.x + a.w;
      const y1 = a.y + a.h / 2;
      const x2 = b.x;
      const y2 = b.y + b.h / 2;
      const mx = (x1 + x2) / 2;
      return { from, to, d: `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`, sameLane: false };
    })
    .filter(Boolean);

  return { positions, edgePaths, totalWidth, totalHeight, layerYStarts, layerHeights, laneCols, laneWidth, laneGapX, headerH, layerOrder, laneOrder, cells };
}

window.computeDagLayout = computeDagLayout;
window.computeSwimlaneLayout = computeSwimlaneLayout;

</script>

function VariantA() {

  const [filter, setFilter] = React.useState("all");

  const filteredModules = filter === "all" ? MODULES : MODULES.filter((m) => m.cluster === filter);
  const filteredIds = new Set(filteredModules.map((m) => m.id));
  const filteredEdges = EDGES.filter(([a, b]) => filteredIds.has(a) && filteredIds.has(b));

  const layout = React.useMemo(
    () => computeDagLayout(filteredModules, filteredEdges, { nodeWidth: 134, nodeHeight: 50, layerGapY: 116, nodeGapX: 14 }),
    [filter]
  );

  // hover/selected に関わるエッジをハイライト
  const highlightId = hover || selected;
  const connectedIds = React.useMemo(() => {
    if (!highlightId) return new Set();
    const s = new Set([highlightId]);
    for (const [a, b] of filteredEdges) {
      if (a === highlightId) s.add(b);
      if (b === highlightId) s.add(a);
    }
    return s;
  }, [highlightId, filteredEdges]);

  const sel = MODULES.find((m) => m.id === selected);

  return (

        <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
          <Brand size={15} />
          <div style={{ width: 1, height: 20, background: T.border }} />
          <div>
            <div style={{ fontSize: 13, fontWeight: 600, color: T.ink, letterSpacing: -0.2 }}>{PR_META.title}</div>
            <div style={{ fontSize: 11, color: T.ink3, fontFamily: T.mono, marginTop: 1 }}>{PR_META.repo} #{PR_META.number} · {PR_META.branch} → {PR_META.base}</div>
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 12, fontSize: 12 }}>

          <span style={{ color: T.removed, fontFamily: T.mono, fontWeight: 500 }}>−{PR_META.deletions}</span>

        </div>

      {/* tabs / filters */}

        <div style={{ display: "flex", gap: 4 }}>
          {[
            { k: "all", label: "全て", n: MODULES.length, c: T.ink },
            { k: "added", label: "追加", n: CLUSTER_STATS.added.count, c: T.added, bg: T.addedBg },
            { k: "removed", label: "削除", n: CLUSTER_STATS.removed.count, c: T.removed, bg: T.removedBg },
            { k: "modified", label: "修正", n: CLUSTER_STATS.modified.count, c: T.modified, bg: T.modifiedBg },
            { k: "refactor", label: "リファクタ", n: CLUSTER_STATS.refactor.count, c: T.refactor, bg: T.refactorBg },
          ].map((f) => {
            const active = filter === f.k;
            return (
              <button key={f.k} onClick={() => setFilter(f.k)} style={{
                padding: "6px 12px", borderRadius: 7, border: "none", cursor: "pointer", fontFamily: "inherit",
                fontSize: 12, fontWeight: active ? 600 : 500,
                background: active ? (f.bg || T.bgAlt) : "transparent",

            modules={filteredModules}

          />

              <div key={l} style={{ background: "#fff", padding: "3px 6px", borderRadius: 4, border: `1px solid ${T.border}`, height: 18, display: "flex", alignItems: "center" }}>{l}</div>

// ─────────── Graph SVG ───────────
function GraphCanvas({ modules, edges, layout, selected, hover, connectedIds, onSelect, onHover }) {
  const { positions, edgePaths, totalWidth, totalHeight } = layout;
  return (
    <svg width={totalWidth} height={totalHeight} style={{ display: "block", minWidth: "100%" }}>
      <defs>
        {Object.entries(CLUSTERS).map(([k, c]) => (
          <marker key={k} id={`arr-${k}`} viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L8,4 L0,8 z" fill={c.color} opacity="0.7" />
          </marker>
        ))}
        <marker id="arr-dim" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
          <path d="M0,0 L8,4 L0,8 z" fill={T.borderStrong} />
        </marker>
      </defs>

      {/* edges */}
      {edgePaths.map((e, i) => {
        const fromMod = modules.find((m) => m.id === e.from);
        const cluster = fromMod ? fromMod.cluster : "modified";
        const dim = (selected || hover) && !(connectedIds.has(e.from) && connectedIds.has(e.to));
        const color = dim ? T.borderStrong : CLUSTERS[cluster].color;
        return (
          <path key={i} d={e.d} fill="none" stroke={color}
            strokeWidth={dim ? 1 : 1.4}
            opacity={dim ? 0.4 : 0.75}
            markerEnd={dim ? "url(#arr-dim)" : `url(#arr-${cluster})`}
          />
        );
      })}

      {/* nodes */}
      {modules.map((m) => {
        const p = positions[m.id];
        if (!p) return null;
        const c = CLUSTERS[m.cluster];
        const isSel = selected === m.id;
        const isHover = hover === m.id;
        const dim = (selected || hover) && !connectedIds.has(m.id);
        return (
          <g key={m.id} transform={`translate(${p.x},${p.y})`}
            onClick={() => onSelect(m.id)}
            onMouseEnter={() => onHover(m.id)} onMouseLeave={() => onHover(null)}
            style={{ cursor: "pointer", opacity: dim ? 0.35 : 1, transition: "opacity 0.15s" }}>
            <rect width={p.w} height={p.h} rx="6" ry="6"
              fill={c.bg}
              stroke={isSel ? T.ink : isHover ? c.color : c.border}
              strokeWidth={isSel ? 2 : isHover ? 1.5 : 1} />
            <rect x="0" y="0" width="3" height={p.h} rx="2" fill={c.color} />
            <text x={p.w / 2} y="20" textAnchor="middle" fontSize="11" fontWeight="600" fill={T.ink} fontFamily={T.font}>
              {m.name.length > 16 ? m.name.slice(0, 15) + "…" : m.name}
            </text>
            <text x={p.w / 2} y="35" textAnchor="middle" fontSize="9" fill={c.color} fontFamily={T.mono} fontWeight="500">
              +{m.additions} −{m.deletions}
            </text>
            <text x={p.w / 2} y="46" textAnchor="middle" fontSize="8" fill={T.ink3} fontFamily={T.mono}>
              {m.functions.length} fn
            </text>
          </g>
        );
      })}
    </svg>
  );
}

// ─────────── Side Panel ───────────
function SidePanel({ module: m }) {
  if (!m) return <div style={{ borderLeft: `1px solid ${T.border}`, background: "#fff" }} />;
  const c = CLUSTERS[m.cluster];
  const diff = SAMPLE_DIFF[m.id];
  return (
    <div style={{ borderLeft: `1px solid ${T.border}`, background: "#fff", display: "flex", flexDirection: "column", overflow: "hidden" }}>
      {/* header */}

          <span style={{ fontSize: 10, fontWeight: 600, color: c.color, background: c.bg, border: `1px solid ${c.border}`, padding: "2px 7px", borderRadius: 99, letterSpacing: 0.5, textTransform: "uppercase" }}>{c.short}</span>
          <span style={{ fontSize: 10, color: T.ink3, fontFamily: T.mono, padding: "2px 6px", background: T.bgAlt, borderRadius: 4 }}>{LAYERS[m.layer].label}</span>
        </div>
        <div style={{ fontSize: 16, fontWeight: 600, letterSpacing: -0.3, color: T.ink, marginBottom: 4, textWrap: "pretty" }}>{m.name}</div>
        <div style={{ fontSize: 11, fontFamily: T.mono, color: T.ink3, wordBreak: "break-all" }}>{m.path}</div>
        <div style={{ display: "flex", gap: 14, marginTop: 12, fontSize: 12 }}>
          <div><span style={{ color: T.added, fontWeight: 600, fontFamily: T.mono }}>+{m.additions}</span> <span style={{ color: T.ink3 }}>追加</span></div>
          <div><span style={{ color: T.removed, fontWeight: 600, fontFamily: T.mono }}>−{m.deletions}</span> <span style={{ color: T.ink3 }}>削除</span></div>
          <div><span style={{ color: T.ink, fontWeight: 600, fontFamily: T.mono }}>{m.loc}</span> <span style={{ color: T.ink3 }}>LOC</span></div>
        </div>
      </div>

      {/* functions */}
      <div style={{ padding: "12px 18px", borderBottom: `1px solid ${T.border}` }}>
        <div style={{ fontSize: 11, color: T.ink3, fontWeight: 600, marginBottom: 8, letterSpacing: 0.5 }}>変更された関数 ({m.functions.length})</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
          {m.functions.map((fn, i) => {
            const fc = CLUSTERS[fn.change] || CLUSTERS.modified;
            return (
              <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 8px", background: T.bgAlt, borderRadius: 5 }}>
                <span style={{ width: 14, height: 14, borderRadius: 3, background: fc.bg, border: `1px solid ${fc.border}`, color: fc.color, fontSize: 10, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700 }}>{fc.icon}</span>
                <span style={{ fontFamily: T.mono, fontSize: 12, color: T.ink, flex: 1 }}>{fn.name}</span>
                <span style={{ fontSize: 10, color: fc.color, textTransform: "uppercase", fontWeight: 600, letterSpacing: 0.4 }}>{fc.short}</span>
              </div>
            );
          })}
        </div>
      </div>

      {/* diff */}
      <div style={{ flex: 1, overflow: "auto", background: T.bgAlt }}>
        <div style={{ padding: "10px 18px", fontSize: 11, color: T.ink3, fontWeight: 600, letterSpacing: 0.5, position: "sticky", top: 0, background: T.bgAlt, borderBottom: `1px solid ${T.border}` }}>
          DIFF プレビュー
        </div>
        {diff ? (
          <div style={{ fontFamily: T.mono, fontSize: 11, lineHeight: 1.55 }}>
            {diff.hunks.map((h, hi) => (
              <div key={hi}>
                <div style={{ padding: "4px 18px", background: "#e0e7ff", color: "#3730a3", fontSize: 10 }}>{h.header}</div>
                {h.lines.map((ln, li) => {
                  const bg = ln.kind === "add" ? "#ecfdf5" : ln.kind === "del" ? "#fef2f2" : "transparent";
                  const sign = ln.kind === "add" ? "+" : ln.kind === "del" ? "−" : " ";
                  const col = ln.kind === "add" ? T.added : ln.kind === "del" ? T.removed : T.ink2;
                  return (
                    <div key={li} style={{ display: "flex", background: bg }}>
                      <div style={{ width: 32, padding: "0 8px", textAlign: "right", color: T.ink3, fontSize: 10, borderRight: `1px solid ${T.border}` }}>{ln.n}</div>
                      <div style={{ width: 14, textAlign: "center", color: col, fontWeight: 600 }}>{sign}</div>
                      <div style={{ flex: 1, padding: "0 8px", color: T.ink, whiteSpace: "pre" }}>{ln.text}</div>
                    </div>
                  );
                })}
              </div>
            ))}
          </div>
        ) : (
          <div style={{ padding: "20px 18px", fontSize: 12, color: T.ink3, fontStyle: "italic" }}>
            このモジュールのdiffプレビューはサンプルに含まれていません。<br/>実際のツールでは GitHub API から取得します。
          </div>
        )}
      </div>
    </div>
  );
}

window.VariantA = VariantA;

</script>
<script type="text/babel">
// variant-b.jsx — 案B: スイムレーン式 — 4クラスタを縦レーンに分けて視覚化
// 横軸: 4クラスタ (added / modified / refactor / removed)
// 縦軸: 4レイヤ (UI / Domain / Data / Infra)
// 同じセルに属するモジュールを並べる + クロスレーンエッジで依存関係を見せる

function VariantB() {
  const [selected, setSelected] = React.useState("m11");
  const [hover, setHover] = React.useState(null);

  const layout = React.useMemo(
    () => computeSwimlaneLayout(MODULES, EDGES, { nodeWidth: 142, nodeHeight: 44, layerGapY: 100, nodeGapY: 8, laneGapX: 22, headerH: 56 }),
    []
  );

  const highlightId = hover || selected;
  const connectedIds = React.useMemo(() => {
    if (!highlightId) return new Set();
    const s = new Set([highlightId]);
    for (const [a, b] of EDGES) {
      if (a === highlightId) s.add(b);
      if (b === highlightId) s.add(a);
    }
    return s;
  }, [highlightId]);

  const sel = MODULES.find((m) => m.id === selected);

  return (
    <div style={{ width: "100%", height: "100%", background: T.bg, fontFamily: T.font, color: T.ink, display: "flex", flexDirection: "column", overflow: "hidden" }}>
      {/* top bar */}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 24px", borderBottom: `1px solid ${T.border}`, background: "#fff" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
          <Brand size={15} />
          <div style={{ width: 1, height: 20, background: T.border }} />
          <div>
            <div style={{ fontSize: 13, fontWeight: 600, color: T.ink, letterSpacing: -0.2 }}>{PR_META.title}</div>
            <div style={{ fontSize: 11, color: T.ink3, fontFamily: T.mono, marginTop: 1 }}>{PR_META.repo} #{PR_META.number} · スイムレーン表示</div>
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 12, fontSize: 12 }}>
          <span style={{ color: T.added, fontFamily: T.mono, fontWeight: 500 }}>+{PR_META.additions}</span>
          <span style={{ color: T.removed, fontFamily: T.mono, fontWeight: 500 }}>−{PR_META.deletions}</span>
          <div style={{ width: 24, height: 24, borderRadius: 99, background: T.brand, color: "#fff", fontSize: 10, fontWeight: 600, display: "flex", alignItems: "center", justifyContent: "center" }}>{PR_META.authorAvatar}</div>
        </div>
      </div>

      {/* cluster summary header */}
      <div style={{ padding: "12px 24px", borderBottom: `1px solid ${T.border}`, background: "#fff", display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12 }}>

          const stat = CLUSTER_STATS[k];
          return (
            <div key={k} style={{ background: c.bg, border: `1px solid ${c.border}`, borderRadius: 10, padding: "10px 14px", display: "flex", alignItems: "center", gap: 12 }}>
              <div style={{ width: 32, height: 32, borderRadius: 8, background: "#fff", color: c.color, fontSize: 16, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center" }}>{c.icon}</div>

                <div style={{ fontSize: 12, fontWeight: 600, color: c.color, letterSpacing: 0.3 }}>{c.label}</div>
                <div style={{ fontSize: 11, color: T.ink2, fontFamily: T.mono }}>{stat.count} mods · +{stat.additions} −{stat.deletions}</div>
              </div>
            </div>
          );
        })}
      </div>

      {/* main */}
      <div style={{ flex: 1, display: "grid", gridTemplateColumns: "1fr 360px", overflow: "hidden" }}>

          <SwimlaneCanvas
            modules={MODULES}
            edges={EDGES}
            layout={layout}
            selected={selected}
            hover={hover}
            connectedIds={connectedIds}
            onSelect={setSelected}
            onHover={setHover}

        <SidePanel module={sel} />

}

function SwimlaneCanvas({ modules, edges, layout, selected, hover, connectedIds, onSelect, onHover }) {
  const { positions, edgePaths, totalWidth, totalHeight, layerYStarts, layerHeights, laneCols, laneWidth, laneGapX, layerOrder, laneOrder } = layout;
  return (
    <svg width={totalWidth} height={totalHeight} style={{ display: "block", minWidth: "100%" }}>
      <defs>
        {Object.entries(CLUSTERS).map(([k, c]) => (
          <marker key={k} id={`arrB-${k}`} viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">

        ))}
        <marker id="arrB-dim" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
          <path d="M0,0 L8,4 L0,8 z" fill={T.borderStrong} />
        </marker>
      </defs>

      {/* lane backgrounds */}
      {laneOrder.map((cl, ci) => {
        const c = CLUSTERS[cl];
        const x = laneCols[ci];
        return (
          <g key={cl}>
            <rect x={x} y={40} width={laneWidth + 28} height={totalHeight - 60} rx="8" fill={c.bg} opacity="0.35" />
            <rect x={x} y={40} width={laneWidth + 28} height={32} rx="8" fill={c.bg} opacity="0.85" />
            <rect x={x} y={56} width={laneWidth + 28} height={16} fill={c.bg} opacity="0.85" />
            <text x={x + (laneWidth + 28) / 2} y={60} textAnchor="middle" fontSize="12" fontWeight="700" fill={c.color} fontFamily={T.font} letterSpacing="0.5">{c.label.toUpperCase()}</text>
          </g>
        );
      })}

      {/* layer separators + labels */}
      {layerOrder.map((ly, li) => {
        const y = layerYStarts[li];
        return (
          <g key={ly}>
            {li > 0 && <line x1={20} y1={y - 6} x2={totalWidth - 20} y2={y - 6} stroke={T.border} strokeDasharray="2 4" />}
            <text x={26} y={y + 6} fontSize="10" fontWeight="600" fill={T.ink3} fontFamily={T.mono} letterSpacing="0.5">{LAYERS[ly].label.toUpperCase()}</text>
          </g>
        );
      })}

      {/* edges */}
      {edgePaths.map((e, i) => {
        const fromMod = modules.find((m) => m.id === e.from);
        const cluster = fromMod ? fromMod.cluster : "modified";
        const dim = (selected || hover) && !(connectedIds.has(e.from) && connectedIds.has(e.to));
        return (
          <path key={i} d={e.d} fill="none"

<script type="text/babel">
// impact.jsx — diff影響範囲の計算 + 可視化案D
// 「変更されたモジュール」を起点に、依存元（呼び出し側）へ何hop伝播するかを計算

// 影響範囲を計算: 変更ノード集合から、エッジを「依存される→依存する」逆方向に辿る
// 結果: { moduleId: { hop: 0|1|2|3..., source: changedModuleId } }
// hop=0: 自分自身が変更されたモジュール
// hop>=1: 変更モジュールに依存している（影響を受ける可能性あり）
function computeImpact(modules, edges, changedClusters = ["added", "removed", "modified", "refactor"]) {
  const isChanged = new Set(modules.filter(m => changedClusters.includes(m.cluster)).map(m => m.id));
  // 逆向きエッジ: m -> [依存しているモジュール群]
  const reverseAdj = {};
  for (const [a, b] of edges) {
    // a -> b の意味は「a が b を使う / 依存する」
    // つまり b が変わると a が影響を受ける
    if (!reverseAdj[b]) reverseAdj[b] = [];
    reverseAdj[b].push(a);
  }
  const impact = {};
  for (const m of modules) {
    if (isChanged.has(m.id)) {
      impact[m.id] = { hop: 0, fromChange: true };
    }
  }
  // BFS
  let frontier = Array.from(isChanged);
  let hop = 0;
  while (frontier.length > 0 && hop < 5) {
    hop++;
    const next = [];
    for (const id of frontier) {
      const callers = reverseAdj[id] || [];
      for (const c of callers) {
        if (impact[c] === undefined || impact[c].hop > hop) {
          impact[c] = { hop, fromChange: isChanged.has(c) };
          next.push(c);
        }
      }
    }
    frontier = next;
  }
  return impact;
}

const IMPACT_LEVELS = {
  0: { label: "変更", color: "#0f766e", bg: "#ccfbf1", border: "#5eead4" },
  1: { label: "直接影響", color: "#ea580c", bg: "#ffedd5", border: "#fdba74" },
  2: { label: "2hop", color: "#ca8a04", bg: "#fef9c3", border: "#fde047" },
  3: { label: "3hop+", color: "#65a30d", bg: "#ecfccb", border: "#bef264" },
  none: { label: "影響なし", color: "#a8a29e", bg: "#f5f5f4", border: "#e7e5e4" },
};

function impactLevel(impactEntry) {
  if (!impactEntry) return "none";
  if (impactEntry.hop === 0) return 0;
  if (impactEntry.hop === 1) return 1;
  if (impactEntry.hop === 2) return 2;
  return 3;
}

// ─────────── 案D: 影響範囲ヒートマップビュー ───────────

  // 各モジュールの影響を受ける関数の数の概算

  return (

        <div style={{ flex: 1, height: 24, background: T.bgAlt, borderRadius: 6, overflow: "hidden", display: "flex" }}>

// 選択モジュールから下流（依存元）へ伝播
function computeImpactFrom(rootId, modules, edges) {
  const reverseAdj = {};
  for (const [a, b] of edges) {
    if (!reverseAdj[b]) reverseAdj[b] = [];
    reverseAdj[b].push(a);
  }
  const impact = { [rootId]: { hop: 0, fromChange: true } };
  let frontier = [rootId];
  let hop = 0;
  while (frontier.length > 0 && hop < 5) {
    hop++;
    const next = [];
    for (const id of frontier) {
      const callers = reverseAdj[id] || [];
      for (const c of callers) {
        if (impact[c] === undefined) {
          impact[c] = { hop, fromChange: false };
          next.push(c);
        }
      }
    }
    frontier = next;
  }
  return impact;
}

function ImpactGraph({ modules, edges, layout, impact, selected, hover, mode, onSelect, onHover }) {
  const { positions, edgePaths, totalWidth, totalHeight } = layout;
  return (
    <svg width={totalWidth} height={totalHeight} style={{ display: "block", minWidth: "100%" }}>
      <defs>
        {Object.entries(IMPACT_LEVELS).map(([k, il]) => (
          <marker key={k} id={`imp-arr-${k}`} viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L8,4 L0,8 z" fill={il.color} opacity="0.7" />
          </marker>
        ))}
      </defs>

      {/* edges — colored by source impact level */}
      {edgePaths.map((e, i) => {
        const aLv = impactLevel(impact && impact[e.from]);
        const bLv = impactLevel(impact && impact[e.to]);
        // 影響伝播エッジ: 両端ともにimpactあり
        const isRipple = aLv !== "none" && bLv !== "none";
        const il = IMPACT_LEVELS[isRipple ? Math.max(typeof aLv === "number" ? aLv : 0, typeof bLv === "number" ? bLv : 0) : "none"];
        return (
          <path key={i} d={e.d} fill="none"
            stroke={isRipple ? il.color : T.borderStrong}
            strokeWidth={isRipple ? 1.6 : 0.8}
            opacity={isRipple ? 0.8 : 0.3}
            markerEnd={`url(#imp-arr-${isRipple ? (typeof aLv === "number" ? aLv : 0) : "none"})`}
          />
        );
      })}

      {/* nodes */}
      {modules.map(m => {
        const p = positions[m.id];
        if (!p) return null;
        const lv = impactLevel(impact && impact[m.id]);
        const il = IMPACT_LEVELS[lv];
        const isSel = selected === m.id;
        const cluster = CLUSTERS[m.cluster];
        return (
          <g key={m.id} transform={`translate(${p.x},${p.y})`}
            onClick={() => onSelect(m.id)}
            onMouseEnter={() => onHover(m.id)} onMouseLeave={() => onHover(null)}
            style={{ cursor: "pointer" }}>
            {/* 波紋（hop>=1のみ） */}
            {typeof lv === "number" && lv >= 1 && (
              <rect x="-4" y="-4" width={p.w + 8} height={p.h + 8} rx="9" fill="none" stroke={il.color} strokeWidth="1.5" opacity={0.4 - lv * 0.08} strokeDasharray="3 3" />
            )}
            <rect width={p.w} height={p.h} rx="6"
              fill={il.bg}
              stroke={isSel ? T.ink : il.border}
              strokeWidth={isSel ? 2 : 1.2}
              opacity={lv === "none" ? 0.55 : 1} />
            {/* hop badge */}
            {typeof lv === "number" && (
              <g>
                <circle cx={p.w - 10} cy="10" r="8" fill={il.color} />
                <text x={p.w - 10} y="13" textAnchor="middle" fontSize="9" fontWeight="700" fill="#fff" fontFamily={T.mono}>{lv}</text>
              </g>
            )}
            {/* cluster left bar */}
            <rect x="0" y="0" width="3" height={p.h} rx="2" fill={cluster.color} opacity={lv === "none" ? 0.3 : 0.8} />
            <text x="9" y="18" fontSize="11" fontWeight="600" fill={T.ink} fontFamily={T.font} opacity={lv === "none" ? 0.5 : 1}>
              {m.name.length > 17 ? m.name.slice(0, 16) + "…" : m.name}
            </text>
            <text x="9" y="32" fontSize="9" fill={il.color} fontFamily={T.mono} fontWeight="500" opacity={lv === "none" ? 0.5 : 1}>
              {lv === 0 ? "● 変更元" : lv === "none" ? "影響なし" : `${lv}-hop 影響`}
            </text>
            <text x="9" y="42" fontSize="8" fill={T.ink3} fontFamily={T.mono} opacity={0.7}>
              {LAYERS[m.layer].label} · {m.functions.length}fn
            </text>
          </g>
        );
      })}
    </svg>
  );
}

function ImpactPanel({ module: m, impact, mode }) {
  if (!m) return <div style={{ borderLeft: `1px solid ${T.border}`, background: "#fff" }} />;
  const lv = impactLevel(impact && impact[m.id]);
  const il = IMPACT_LEVELS[lv];
  const cluster = CLUSTERS[m.cluster];

  // この選択モジュールが影響を及ぼすモジュール一覧
  const downstream = [];
  const upstream = [];
  for (const [a, b] of EDGES) {
    if (a === m.id) downstream.push(b);
    if (b === m.id) upstream.push(a);
  }
  const downstreamMods = downstream.map(id => MODULES.find(x => x.id === id)).filter(Boolean);
  const upstreamMods = upstream.map(id => MODULES.find(x => x.id === id)).filter(Boolean);

  // hop別の影響先
  const buckets = { 1: [], 2: [], 3: [] };
  if (mode === "select") {
    for (const mod of MODULES) {
      const e = impact && impact[mod.id];
      if (!e || e.hop === 0) continue;
      const b = e.hop >= 3 ? 3 : e.hop;
      buckets[b].push(mod);
    }
  }

  return (
    <div style={{ borderLeft: `1px solid ${T.border}`, background: "#fff", display: "flex", flexDirection: "column", overflow: "hidden" }}>
      <div style={{ padding: "16px 18px", borderBottom: `1px solid ${T.border}`, background: il.bg }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
          <span style={{ fontSize: 10, fontWeight: 700, color: il.color, background: "#fff", padding: "2px 8px", borderRadius: 99, letterSpacing: 0.4, textTransform: "uppercase" }}>{il.label}</span>
          <span style={{ fontSize: 10, color: cluster.color, background: "#fff", border: `1px solid ${cluster.border}`, padding: "2px 7px", borderRadius: 99, fontWeight: 600 }}>{cluster.short}</span>
          <span style={{ fontSize: 10, color: T.ink3, fontFamily: T.mono, padding: "2px 6px", background: "rgba(255,255,255,0.6)", borderRadius: 4 }}>{LAYERS[m.layer].label}</span>
        </div>
        <div style={{ fontSize: 16, fontWeight: 600, letterSpacing: -0.3, color: T.ink, marginBottom: 4 }}>{m.name}</div>
        <div style={{ fontSize: 11, fontFamily: T.mono, color: T.ink3, wordBreak: "break-all" }}>{m.path}</div>
      </div>

      <div style={{ flex: 1, overflow: "auto", padding: "12px 18px" }}>
        {/* 影響範囲サマリー */}
        <div style={{ marginBottom: 14 }}>
          <div style={{ fontSize: 11, color: T.ink3, fontWeight: 600, letterSpacing: 0.5, marginBottom: 8 }}>
            {mode === "select" ? "このモジュールの波紋" : "依存関係サマリー"}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            <div style={{ padding: "10px 12px", background: T.bgAlt, borderRadius: 7 }}>
              <div style={{ fontSize: 10, color: T.ink3, fontWeight: 600 }}>↑ 依存元（影響を受ける）</div>
              <div style={{ fontSize: 22, fontWeight: 600, color: T.ink, fontVariantNumeric: "tabular-nums", letterSpacing: -0.4 }}>{upstreamMods.length}</div>
            </div>
            <div style={{ padding: "10px 12px", background: T.bgAlt, borderRadius: 7 }}>
              <div style={{ fontSize: 10, color: T.ink3, fontWeight: 600 }}>↓ 依存先（影響を与える）</div>
              <div style={{ fontSize: 22, fontWeight: 600, color: T.ink, fontVariantNumeric: "tabular-nums", letterSpacing: -0.4 }}>{downstreamMods.length}</div>
            </div>
          </div>
        </div>

        {mode === "select" && (
          <div style={{ marginBottom: 14 }}>
            <div style={{ fontSize: 11, color: T.ink3, fontWeight: 600, letterSpacing: 0.5, marginBottom: 8 }}>影響範囲（hop別）</div>
            {[1, 2, 3].map(hop => {
              const list = buckets[hop];
              const il2 = IMPACT_LEVELS[hop];
              if (list.length === 0) return null;
              return (
                <div key={hop} style={{ marginBottom: 8 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 4 }}>
                    <span style={{ width: 18, height: 18, borderRadius: 4, background: il2.color, color: "#fff", fontSize: 10, fontWeight: 700, fontFamily: T.mono, display: "flex", alignItems: "center", justifyContent: "center" }}>{hop}</span>
                    <span style={{ fontSize: 11, color: T.ink2, fontWeight: 600 }}>{il2.label}</span>
                    <span style={{ fontSize: 11, color: T.ink3, fontFamily: T.mono }}>{list.length}件</span>
                  </div>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
                    {list.map(mod => (
                      <div key={mod.id} style={{ padding: "3px 7px", background: il2.bg, border: `1px solid ${il2.border}`, color: il2.color, borderRadius: 4, fontSize: 10, fontFamily: T.mono, fontWeight: 500 }}>
                        {mod.name}
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        )}

        <div style={{ marginBottom: 14 }}>
          <div style={{ fontSize: 11, color: T.ink3, fontWeight: 600, letterSpacing: 0.5, marginBottom: 6 }}>↑ 依存元 ({upstreamMods.length})</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
            {upstreamMods.slice(0, 6).map(mod => {
              const ml = impactLevel(impact && impact[mod.id]);
              const mil = IMPACT_LEVELS[ml];
              return (
                <div key={mod.id} style={{ display: "flex", alignItems: "center", gap: 6, padding: "5px 8px", background: T.bgAlt, borderRadius: 5, fontSize: 11 }}>
                  <div style={{ width: 6, height: 6, borderRadius: 99, background: mil.color }} />
                  <span style={{ fontFamily: T.mono, color: T.ink, flex: 1 }}>{mod.name}</span>
                  <span style={{ fontSize: 9, color: mil.color, fontWeight: 600 }}>{typeof ml === "number" ? `${ml}hop` : ""}</span>
                </div>
              );
            })}
          </div>
        </div>

        <div>
          <div style={{ fontSize: 11, color: T.ink3, fontWeight: 600, letterSpacing: 0.5, marginBottom: 6 }}>変更された関数</div>
          {m.functions.map((fn, i) => {
            const fc = CLUSTERS[fn.change] || CLUSTERS.modified;
            return (
              <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, padding: "5px 8px", marginBottom: 3, background: T.bgAlt, borderRadius: 5 }}>
                <span style={{ width: 14, height: 14, borderRadius: 3, background: fc.bg, border: `1px solid ${fc.border}`, color: fc.color, fontSize: 10, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700 }}>{fc.icon}</span>
                <span style={{ fontFamily: T.mono, fontSize: 11, color: T.ink, flex: 1 }}>{fn.name}</span>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

window.VariantD = VariantD;
window.computeImpact = computeImpact;
window.computeImpactFrom = computeImpactFrom;
window.IMPACT_LEVELS = IMPACT_LEVELS;

</script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "showClusters": true,
  "nodeDensity": "comfortable",
  "panelPosition": "right",
  "showLayerLabels": true
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  return (
    <>
      <DesignCanvas>
        <DCSection id="flow" title="ユーザーフロー" subtitle="ランディング → ログイン後 PR入力 → 解析中">
          <DCArtboard id="landing" label="① ランディング" width={1080} height={780}>
            <Landing />
          </DCArtboard>
          <DCArtboard id="input" label="② PR入力 (ログイン済み)" width={1080} height={780}>
            <PrInput />
          </DCArtboard>
          <DCArtboard id="analyzing" label="③ 解析中" width={1080} height={780}>
            <Analyzing />
          </DCArtboard>
        </DCSection>

        <DCSection id="results" title="解析結果ビュー" subtitle="3案を比較 — クリックでフォーカス表示">
          <DCArtboard id="va" label="案A · クラシックDAG (右パネル)" width={1280} height={820}>
            <VariantA />
          </DCArtboard>
          <DCArtboard id="vb" label="案B · スイムレーン (4クラスタ縦割り)" width={1280} height={820}>
            <VariantB />
          </DCArtboard>
          <DCArtboard id="vc" label="案C · ダッシュボード型サマリー" width={1280} height={820}>
            <VariantC />
          </DCArtboard>
        </DCSection>

        <DCSection id="impact" title="影響範囲の可視化" subtitle="diffの伝播 — 何が壊れる可能性があるか">
          <DCArtboard id="vd" label="案D · 影響範囲ヒートマップ (hop別の波紋)" width={1280} height={820}>
            <VariantD />
          </DCArtboard>
        </DCSection>

        <DCPostIt top={20} left={40} rotate={-3} width={200}>
          ３案ともdiff定番カラー（緑/赤/橙/紫）で統一。<br/>用途で使い分けるのがおすすめ。
        </DCPostIt>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection title="表示">
          <TweakToggle label="クラスタ色を表示" value={tweaks.showClusters} onChange={(v) => setTweak('showClusters', v)} />
          <TweakToggle label="レイヤラベル" value={tweaks.showLayerLabels} onChange={(v) => setTweak('showLayerLabels', v)} />
        </TweakSection>
        <TweakSection title="グラフ">
          <TweakRadio label="ノード密度" value={tweaks.nodeDensity} options={[
            { value: 'compact', label: '密' },
            { value: 'comfortable', label: '標準' },
            { value: 'spacious', label: '疎' },
          ]} onChange={(v) => setTweak('nodeDensity', v)} />
        </TweakSection>
        <TweakSection title="サイドパネル">
          <TweakRadio label="位置" value={tweaks.panelPosition} options={[
            { value: 'right', label: '右' },
            { value: 'bottom', label: '下' },
            { value: 'overlay', label: 'オーバーレイ' },
          ]} onChange={(v) => setTweak('panelPosition', v)} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
