<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>DiffGraph. — PR依存関係可視化ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #faf8f3; font-family: "Inter Tight", -apple-system, system-ui, sans-serif; }
  * { box-sizing: border-box; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="graph-layout.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="variant-a.jsx"></script>
<script type="text/babel" src="variant-b.jsx"></script>
<script type="text/babel" src="variant-c.jsx"></script>
<script type="text/babel" src="impact.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "showClusters": true,
  "nodeDensity": "comfortable",
  "panelPosition": "right",
  "showLayerLabels": true
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  return (
    <>
      <DesignCanvas>
        <DCSection id="flow" title="ユーザーフロー" subtitle="ランディング → ログイン後 PR入力 → 解析中">
          <DCArtboard id="landing" label="① ランディング" width={1080} height={780}>
            <Landing />
          </DCArtboard>
          <DCArtboard id="input" label="② PR入力 (ログイン済み)" width={1080} height={780}>
            <PrInput />
          </DCArtboard>
          <DCArtboard id="analyzing" label="③ 解析中" width={1080} height={780}>
            <Analyzing />
          </DCArtboard>
        </DCSection>

        <DCSection id="results" title="解析結果ビュー" subtitle="3案を比較 — クリックでフォーカス表示">
          <DCArtboard id="va" label="案A · クラシックDAG (右パネル)" width={1280} height={820}>
            <VariantA />
          </DCArtboard>
          <DCArtboard id="vb" label="案B · スイムレーン (4クラスタ縦割り)" width={1280} height={820}>
            <VariantB />
          </DCArtboard>
          <DCArtboard id="vc" label="案C · ダッシュボード型サマリー" width={1280} height={820}>
            <VariantC />
          </DCArtboard>
        </DCSection>

        <DCSection id="impact" title="影響範囲の可視化" subtitle="diffの伝播 — 何が壊れる可能性があるか">
          <DCArtboard id="vd" label="案D · 影響範囲ヒートマップ (hop別の波紋)" width={1280} height={820}>
            <VariantD />
          </DCArtboard>
        </DCSection>

        <DCPostIt top={20} left={40} rotate={-3} width={200}>
          ３案ともdiff定番カラー（緑/赤/橙/紫）で統一。<br/>用途で使い分けるのがおすすめ。
        </DCPostIt>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection title="表示">
          <TweakToggle label="クラスタ色を表示" value={tweaks.showClusters} onChange={(v) => setTweak('showClusters', v)} />
          <TweakToggle label="レイヤラベル" value={tweaks.showLayerLabels} onChange={(v) => setTweak('showLayerLabels', v)} />
        </TweakSection>
        <TweakSection title="グラフ">
          <TweakRadio label="ノード密度" value={tweaks.nodeDensity} options={[
            { value: 'compact', label: '密' },
            { value: 'comfortable', label: '標準' },
            { value: 'spacious', label: '疎' },
          ]} onChange={(v) => setTweak('nodeDensity', v)} />
        </TweakSection>
        <TweakSection title="サイドパネル">
          <TweakRadio label="位置" value={tweaks.panelPosition} options={[
            { value: 'right', label: '右' },
            { value: 'bottom', label: '下' },
            { value: 'overlay', label: 'オーバーレイ' },
          ]} onChange={(v) => setTweak('panelPosition', v)} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
