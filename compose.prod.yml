services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "${PORT:-20080}:28080"
    environment:
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL:-http://localhost:20080/auth/github/callback}
      - SESSION_SECRET=${SESSION_SECRET}
      - DB_PATH=/app/data/reviewarena.db
      - GOMEMLIMIT=4GiB
    volumes:
      - app-data:/app/data
      - go-build-cache:/go/cache/go-build
      - go-mod-cache:/go/pkg/mod
    mem_limit: 5g

volumes:
  app-data:
  go-build-cache:
  go-mod-cache:
