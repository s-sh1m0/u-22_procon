services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile.prod
    ports:
      - "${PORT:-20080}:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    # 解析中に kill した go コマンドの子プロセス（compile）は PID 1 に付け替わる。
    # server は回収しないのでゾンビが溜まる。init を PID 1 にして回収させる。
    init: true
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      GOMEMLIMIT: "4GiB"
      GOCACHE: /go/cache/go-build
      GOMODCACHE: /go/pkg/mod
    mem_limit: 5g
    restart: unless-stopped
    volumes:
      - app-data:/app/data
      - go-build-cache:/go/cache/go-build
      - go-mod-cache:/go/pkg/mod

volumes:
  app-data:
  go-build-cache:
  go-mod-cache:
